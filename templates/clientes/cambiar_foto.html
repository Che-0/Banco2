{% extends 'base.html' %}

{% block title %}Cambiar Foto{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h4 class="mb-0">Cambiar foto de perfil</h4>
            </div>
            <div class="card-body text-center">
                
                <div class="mb-4">
                    {% if cliente.foto %}
                        <img src="{{ cliente.foto.url }}" alt="Foto actual" class="rounded-circle" width="120" height="120" style="object-fit: cover;">
                    {% else %}
                        <img src="/media/clientes/fotos/default.png" alt="Foto actual" class="rounded-circle" width="120" height="120" style="object-fit: cover;">
                    {% endif %}
                </div>

                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    
                    <div class="mb-3 text-start">
                        <label class="form-label">{{ form.foto.label }}</label>
                        {{ form.foto }}
                        {% if form.foto.errors %}
                            <div class="text-danger small">{{ form.foto.errors }}</div>
                        {% endif %}
                    </div>

                    <div class="d-flex gap-2 justify-content-center">
                        <button type="submit" class="btn btn-primary">Guardar foto</button>
                        <a href="{% url 'clientes:portal' %}" class="btn btn-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
